<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>night sky · angela parahinog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p class="name">ANGELA PARAHINOG</p>
    <p class="sub">NIGHT SKY · 2026 CONTRIBUTIONS</p>
    <p class="tag">one star for every day I made progress</p>
    <p class="lit" id="lit"></p>
    <svg id="sky" viewBox="0 0 640 118" role="img" aria-label="Contribution stars"></svg>
    <footer>
      <ul class="legend">
        <li><span class="dot rest"></span>REST DAY</li>
        <li><span class="dot progress"></span>PROGRESS</li>
        <li><span class="dot big"></span>BIG DAY</li>
      </ul>
      <a class="btn" href="https://github.com/AngelaPar"><span class="dot accent"></span>VIEW ON GITHUB</a>
    </footer>
  </main>
  <script src="sky.js"></script>
</body>
</html>
